name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Rust stable for MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test map model
        run: npm run test:map

      - name: Test operation refresh concurrency
        run: npm run test:operations

      - name: Test catalog model
        run: npm run test:catalog

      - name: Test simulator model
        run: npm run test:simulator

      - name: Test IPC errors
        run: npm run test:ipc

      - name: Test UI accessibility labels
        run: npm run test:accessibility

      - name: Test alert refresh concurrency
        run: npm run test:alerts

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test performance benchmark
        run: cargo test --manifest-path src-tauri/Cargo.toml --example ard21_benchmark

      - name: Build Tauri Windows installer
        run: npm run tauri -- build

      - name: Verify NSIS install, launch, and uninstall
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $installers = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Se esperaba un solo instalador NSIS de Ariadna; se encontraron $($installers.Count)." }
          $installer = $installers[0]
          ./scripts/verify-windows-installer.ps1 -InstallerPath $installer.FullName -EvidencePath "$env:RUNNER_TEMP/ariadna-ard-22-verification.md"

      - name: Upload Windows installer and verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ariadna-windows-nsis-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            ${{ runner.temp }}/ariadna-ard-22-verification.md
          if-no-files-found: warn
          retention-days: 14
