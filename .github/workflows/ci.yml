name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Rust stable for MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test map model
        run: npm run test:map

      - name: Test warehouse map view focus restoration
        run: npm run test:map-view

      - name: Test operation refresh concurrency
        run: npm run test:operations

      - name: Test operation view retry and confirmation states
        run: npm run test:operations-view

      - name: Test units view request concurrency
        run: npm run test:units-view

      - name: Test units view rendering and history navigation
        run: npm run test:units-view-dom

      - name: Test catalog model
        run: npm run test:catalog

      - name: Test catalog edit request concurrency
        run: npm run test:catalog-views

      - name: Test simulator model
        run: npm run test:simulator

      - name: Test simulator view
        run: npm run test:simulator-view

      - name: Test IPC errors
        run: npm run test:ipc

      - name: Test search detail availability
        run: npm run test:search

      - name: Test UI accessibility labels
        run: npm run test:accessibility

      - name: Test alert refresh concurrency
        run: npm run test:alerts

      - name: Test alert view references and failure states
        run: npm run test:alerts-view

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test performance benchmark
        run: cargo test --manifest-path src-tauri/Cargo.toml --example ard21_benchmark

      - name: Build Tauri Windows installer
        run: npm run tauri -- build

      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --locked

      - name: Install matching Edge WebDriver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          $edgeDriver = Join-Path $PWD.Path "msedgedriver.exe"
          $tauriDriver = Join-Path $env:USERPROFILE ".cargo\bin\tauri-driver.exe"
          if (-not (Test-Path -LiteralPath $edgeDriver -PathType Leaf)) { throw "No se descargó msedgedriver.exe en $PWD." }
          if (-not (Test-Path -LiteralPath $tauriDriver -PathType Leaf)) { throw "No se encontró tauri-driver.exe en $tauriDriver." }
          Write-Host "Edge WebDriver: $(& $edgeDriver --version)"
          Write-Host "tauri-driver: $tauriDriver"
          "ARIADNA_EDGE_DRIVER_BINARY=$edgeDriver" >> $env:GITHUB_ENV
          "ARIADNA_TAURI_DRIVER_BINARY=$tauriDriver" >> $env:GITHUB_ENV

      - name: Install Tauri end-to-end test dependencies
        run: npm ci --prefix e2e-tests

      - name: Install gsudo for WebView2 acceptance
        shell: pwsh
        run: |
          choco install gsudo --version=2.6.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gsudo = Join-Path $env:ChocolateyInstall "lib\gsudo\tools\x64\gsudo.exe"
          if (-not (Test-Path -LiteralPath $gsudo -PathType Leaf)) { throw "No se encontró gsudo en $gsudo." }
          "ARIADNA_GSUDO_BINARY=$gsudo" >> $env:GITHUB_ENV

      - name: Run Tauri end-to-end acceptance
        shell: pwsh
        env:
          ARIADNA_APP_BINARY: ${{ github.workspace }}/src-tauri/target/release/ariadna.exe
          ARIADNA_E2E_ARTIFACTS: ${{ runner.temp }}
          ARIADNA_TEST_APP_DATA_DIR: ${{ runner.temp }}/ariadna-e2e/appdata
        run: |
          $testDataDirectory = $env:ARIADNA_TEST_APP_DATA_DIR.Replace("'", "''")
          $testCommand = "`$env:ARIADNA_TEST_APP_DATA_DIR = '$testDataDirectory'; npm test --prefix e2e-tests"
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" | Out-Null
          & $env:ARIADNA_GSUDO_BINARY --integrity Medium pwsh -NoProfile -Command $testCommand
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $diagnosticPath = Join-Path $env:ARIADNA_E2E_ARTIFACTS "ariadna-tauri-e2e-diagnostic.json"
            if (Test-Path -LiteralPath $diagnosticPath -PathType Leaf) {
              $diagnostic = [System.IO.File]::ReadAllText($diagnosticPath).Trim()
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Fallo de aceptación E2E`n`n$diagnostic"
              $commandDiagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace(':', '%3A').Replace(',', '%2C')
              Write-Output "::error title=Ariadna E2E falló::$commandDiagnostic"
            }
            exit $testExitCode
          }

      - name: Verify NSIS install, launch, and uninstall
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARIADNA_TEST_APP_DATA_DIR: ${{ runner.temp }}/ariadna-ard-22-profile
        run: |
          $installers = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Se esperaba un solo instalador NSIS de Ariadna; se encontraron $($installers.Count)." }
          $installer = $installers[0]
          ./scripts/verify-windows-installer.ps1 -InstallerPath $installer.FullName -EvidencePath "$env:RUNNER_TEMP/ariadna-ard-22-verification.md"

      - name: Publish NSIS verification evidence and failure detail
        if: always()
        shell: pwsh
        run: |
          $evidencePath = Join-Path $env:RUNNER_TEMP "ariadna-ard-22-verification.md"
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Verificación NSIS`n`nNo se generó el documento de evidencia."
            exit 0
          }
          $evidence = [System.IO.File]::ReadAllText($evidencePath).Trim()
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Verificación NSIS`n`n$evidence"
          $failureMatch = [regex]::Match($evidence, '(?m)^Detalle del resultado: (.+)$')
          if ($failureMatch.Success -and $failureMatch.Groups[1].Value -ne "Sin errores.") {
            $detail = $failureMatch.Groups[1].Value.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace(':', '%3A').Replace(',', '%2C')
            Write-Output "::error title=Verificación NSIS::$detail"
          }

      - name: Upload Windows installer and verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ariadna-windows-nsis-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            ${{ runner.temp }}/ariadna-ard-22-verification.md
            ${{ runner.temp }}/ariadna-tauri-e2e-*.png
            ${{ runner.temp }}/ariadna-tauri-e2e-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
